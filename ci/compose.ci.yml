# The CI-only compose override (AD-22, CON-3). lib-live.sh layers it after docker/tests/compose.throwaway.yml in every
# throwaway project; the judges' docker-compose.yml names neither this file nor a mock.
# It passes OCUTALON_EVAL through from the environment of docker compose (default 0) and adds nothing else to the iris
# service: no port, no env_file and no key variable. The model mock (Story 0.11) joins as a service named mock.
name: ocutalon-ci

services:
  iris:
    environment:
      OCUTALON_EVAL: ${OCUTALON_EVAL:-0}
