<!DOCTYPE html>
<!--
  The online demo's busy page (Story 16.5; AD-13, AD-25). The demo host's proxy serves it in place of IRIS's HTTP 503 for every request
  under /ocutalon/ except /ocutalon/api/, whatever the path, so it holds no image and no file: a relative file would be answered by
  that same 503. It is one self-contained file, pure ASCII, with no script, no style attribute and no external file. The styles
  restate the splash screen's resolved light and dark values; the public-text check (web/scripts/host-pages.test.mjs) holds its texts
  to the catalog's and the UX's, and the boundaries check scans it. It names no host, address, port or other infrastructure detail.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Try OcuTalon</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light dark; }
    *, *::before, *::after { box-sizing: border-box; }
    html { background: #FFFFFF; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #FFFFFF;
      color: #102A45;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 400px;
      max-width: 100%;
      padding: 24px;
      background: #FFFFFF;
      border: 1px solid #D3DCE5;
      border-radius: 10px;
    }
    .card h1 {
      margin: 0 0 16px;
      color: #102A45;
      font-family: 'Avenir Next', 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }
    .card p { margin: 0; color: #4A5C72; font-size: 15px; line-height: 1.55; }
    .card p + p { margin-top: 16px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
      border: 0;
    }
    .icon {
      width: 14px;
      height: 14px;
      margin-left: 4px;
      vertical-align: -2px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .link {
      color: #1A6F6D;
      font-weight: 600;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .link:hover { text-decoration-thickness: 2px; }
    .link:focus {
      outline: 2px solid #1A6F6D;
      outline-offset: 2px;
      box-shadow: 0 0 0 2px #FFFFFF;
      text-decoration-thickness: 2px;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #11192B; }
      body { color: #EEF2F7; }
      .card { background: #18233A; border-color: #2E3D5A; }
      .card h1 { color: #EEF2F7; }
      .card p { color: #AAB6C8; }
      .link { color: #5CC9C3; }
      .link:focus { outline-color: #5CC9C3; box-shadow: 0 0 0 2px #18233A; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="card">
      <h1>The demo is busy right now.</h1>
      <p>Try again in a few minutes, or install it yourself.</p>
      <p><a class="link" href="https://github.com/jbrandtmse/OcuTalon#readme" target="_blank" rel="noopener noreferrer">Install it yourself (README)<span class="sr-only"> (opens in a new tab)</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg></a></p>
    </div>
  </main>
</body>
</html>
