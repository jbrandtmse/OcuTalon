# /epic-cycle --unattended policy for OcuTalon. Project-owned. Supersedes the hand-written Rule 22 grant (cef5f60)
# from 2026-10-21. Change it only during a hold, commit it, then resume.
version: 2
product_defaults:
  - The demo path comes first. Prefer the option that keeps UJ-1 real and the demo-path test green.
  - Never weaken a non-negotiable (N1-N15 in the scope brief) or any AD's "Prevents" line. In particular, no false all-clear; risky actions always wait for approval; every demo step is generated live, with no canned replies; no key or token in IRIS, a log, a commit or the trace; the AI Hub image never goes to any registry, cache or artifact; Claude Haiku 5.5 is the default model and no request sets temperature, top_p or top_k; MCP tools are governed like built-in tools.
  - Governed and honest. When a choice trades safety for convenience, keep the safe behaviour and make it convenient. Text claims only what the product does (tokens and cost are per turn and per decision, never per step).
  - The architecture spine is the contract; where it is silent, choose the simplest option consistent with it.
  - Measure, don't guess. Unknown platform behaviour gets a Task 0 measurement on the slot or a throwaway; anything unmeasured is labelled (inference).
  - Smaller is better; split rather than stretch a story.
  - Any mention of OpenClaw carries the not-affiliated note; OpenClaw's name is never part of a product name, and its logo or artwork is never used.
