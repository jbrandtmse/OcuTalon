# Contest Planner ("APPROVE AS PRESENTED"); epics.md's dependency text was aligned in the same commit (AMENDED 2026-10-23).
#
# Dispatch rules on top of depends_on (the orchestrator enforces them):
#   - At most one live runner per lane: each lane has one dev slot (skill-rules Rule 21).
#   - Within a lane, epics dispatch in `lanes.<L>.order`: the next one starts once every earlier epic of the lane has
#     merged or ended parked, stopped or waiting (dispatch.yaml state waiting or held_merge), and its own depends_on
#     have merged. An epic marked fill_ahead may start out of order while the next epic in order is not yet eligible.
#   - story_waits are story-level needs on another epic's merge: the runner sets that story aside (doctrine U14,
#     waiting_on) and continues with independent work; it is re-dispatched once that epic has merged. An epic merges
#     only when every story is done, so it merges after every epic its story_waits name.
#   - Epic 11 may change either lane's files (AD-29): its stories that touch files of an in-flight epic wait
#     until that epic merges (contended paths).
#   - Lane C (runner C, slot ocutalon-slot-c) owns no packages; each epic keeps its home lane's files (AD-29). Two
#     runners in one home lane's files are kept apart by the per-epic paths_hint below (never lane-wide hints, which
#     would read as 100% overlap) and by the contended paths in each runner's spawn prompt.
#   - No whole-epic soft-serialization edge: every estimated overlap above footprint_overlap_threshold (0.20) is
#     resolved by a story wait that puts the overlapping story after the other epic's merge (8 vs 4: 8.3, 8.4;
#     31 vs 16: 31.1, 31.2; 14 vs 11: 14.1, 14.2).
