#
# Dispatch rules on top of depends_on (the orchestrator enforces them):
#   - At most one live runner per lane: each lane has one dev slot (skill-rules Rule 21).
#   - Within a lane, epics dispatch in `lanes.<L>.order`: the next one starts once every earlier epic of the lane has
#     merged or ended parked, stopped or waiting (dispatch.yaml state waiting or held_merge), and its own depends_on
#     have merged. An epic marked fill_ahead may start out of order while the next epic in order is not yet eligible.
#   - story_waits are story-level needs on another epic's merge: the runner sets that story aside (doctrine U14,
#     waiting_on) and continues with independent work; it is re-dispatched once that epic has merged. An epic merges
#     only when every story is done, so it merges after every epic its story_waits name.
#   - Epic 11 may change either lane's files (AD-29): its stories that touch files of an in-flight epic wait
#     until that epic merges (contended paths).
#   - Lane C (runner C, slot ocutalon-slot-c) owns no packages; each epic keeps its home lane's files (AD-29). Two
#     runners in one home lane's files are kept apart by the per-epic paths_hint below (never lane-wide hints, which
#     would read as 100% overlap) and by the contended paths in each runner's spawn prompt.
#   - The pool (lanes.pool.order): When nothing in a runner's own order is eligible (every remaining epic there merged,
#     held, or ended parked, stopped or waiting, or blocked by an unmerged dependency or a missing gate tag), it takes
#     the first eligible epic in lanes.pool.order (Epic 12 heads it). When its own next epic becomes eligible, it takes
#     that when its current epic run ends, with no preemption. fill_ahead_any (Epics 9, 10 and 13) may be started early
#     by any idle runner, for their stories that wait on nothing, and resume later on their own lane or the pool; one
#     live runner per epic, as always. Each pool epic keeps its home lane's files whichever runner takes it; in a
#     contracts epic (33-37) each story keeps its own (Lane A's for Stories 33.1-37.1, Lane B's for 33.2-37.2), and
#     in a personality epic (39-41) the lane each story names (2026-10-31, U-195).
#   - gate {tag: <t>} (2026-10-25, the start counterpart of merge_gate): an epic with a gate is not eligible until
#     `git ls-remote --tags origin <t>` finds the tag. Epics 33 and 34 carry `gate: {tag: v0.1.0}` beside their edge on
#     Epic 12, and `merge_gate: {tag: v0.1.1}` (AD-29: no step work merged before 0.1.1), and so do 17 and 18; every
#     other step epic depends on 33 or 34. [Changed 2026-10-31 from `gate: {tag: v0.1.1}`; see the header.] The orchestrator checks the tag at
#     every notification and dispatch, as for merge_gate. While every remaining epic waits only on a missing tag, the
#     run ends with its report (U14), and the next launch after the tag dispatches them.
#   - An epic dispatched to a runner other than its last one uses that runner's slot: before its first stage, the runner
#     loads and compiles the epic's classes from its worktree into the slot (Rule 21) and checks it with
#     iris_server_info; the runner_dispatched line names lane=<runner> slot=<slot> (the Contest Planner's condition).
#   - merge_gate {branch: <b>} (2026-10-31, owner: 'One check, at 1.0.0'): as merge_gate {tag}, but held until
#     `git ls-remote --heads origin <b>` finds the branch; Epics 33, 34, 17 and 18 carry {branch: release/1.0.0-rc1},
#     and so do the personality epics 39, 40 and 41 (2026-10-31, U-195).
#   - merge_gate {tag: <t>} (2026-10-25, U-67): a finished epic with a merge gate is held (dispatch.yaml held_merge, reason
#     gate:<t>) until `git ls-remote --tags origin <t>` finds the tag; the orchestrator then resumes or re-dispatches its
#     runner for one integrate-forward and merges. The orchestrator checks the tag at every notification and dispatch.
#   - No whole-epic soft-serialization edge: every estimated overlap above footprint_overlap_threshold (0.20) is
#     resolved by a story wait that puts the overlapping story after the other epic's merge (8 vs 4: 8.3, 8.4;
#     31 vs 16: 31.1, 31.2; 14 vs 11: 14.1, 14.2).
