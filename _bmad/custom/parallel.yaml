# Parallel epic execution — read by /epic-cycle (orchestrator mode).
# Safe defaults; tune per project.

max_parallel_epics: 3            # 2026-10-22, owner: "Okay, we'll start with 3 slots." (was 2); lanes A, B and C, one dev slot each (Rule 21)
worktree_base: .worktrees        # short path under repo root; use e.g. C:\wt\<proj> if MAX_PATH bites
runner_isolation: subagent       # subagent (supported) | headless (designed, Phase 3 — not yet implemented)
submodule_mode: gitlink-worktree # gitlink-worktree (default; shared objects, teardown-safe)
                                 # | clone-per-worktree (plain init; unpushed work dies at teardown)
                                 # | none (project has no submodules)
footprint_overlap_threshold: 0.20  # estimated file-overlap between two epics above this -> serialize them
merge_policy: queue-ask          # queue-ask (user approves each epic merge; only supported policy today)
story_parallelism: off           # off is the only supported value under BMAD v6.11 — story-level batching inside one
                                 # checkout is retired (bmad-build-auto's clean-tree checks); concurrency is per-epic worktrees
build_auto_mode: spawned         # spawned (default; runner spawns bmad-build-auto stage agents — depth-3 nesting)
                                 # | inline (runner invokes bmad-build-auto via Skill; implement tier must then be
                                 #   routed through _bmad/custom/bmad-build-auto.toml implementation_handoff — see Runner-Mode Deltas)
integrate_conflicts: ask         # code conflicts when a runner merges the feature branch forward before completing:
                                 # ask (default) = every one is a Clarification; resolve-plain = the runner resolves a
                                 # conflict whose two sides' intent is plain (both kept: a union of list entries, keys,
                                 # imports, tests) and still asks for any behaviour choice (skeleton item 9)

# Runtime-touching stages serialize behind named claim-file locks
# (<worktree_base>/.coordination/locks/<name>.lock). A project with no shared
# live runtime (no shared dev server/namespace/ports) can set stages: [].
# Note: the implement stage (bmad-build-auto) runs the project's tests during its
# Matrix Test Audit and self-review — add `implement` if those tests touch the shared runtime.
runtime_locks:
  - name: runtime
    stages: []   # 2026-10-22 (owner-approved, kit maintainer's advice): each lane has its own dev slot (Rule 21) and throwaways are tag-isolated, so no stage shares a runtime; was [smoke, qa, adr_verifications]
    stale_minutes: 45
  # docker/tests/lib-live.sh claims throwaway-iris.lock in the coordination folder while a throwaway IRIS stack runs, so that two
  # epics never run two stacks at once on this machine. No stage holds it: stages is empty and the live scripts take it themselves.
  - name: throwaway-iris
    stages: []
    stale_minutes: 20
  # Story 32.4: ci/warm.sh holds warm-iris.lock in the lane's lock folder (Rule 21) for a whole stage while the lane's warm
  # stack is up, so its stale age is long. As for every lock, the orchestrator sweeps it only after its owner is confirmed dead.
  # [2026-10-23, the Contest Planner under the owner's delegation, closing DW-111 from Epic 32's decision sheet]
  - name: warm-iris
    stages: []
    stale_minutes: 240

# Optional worktree bootstrap: untracked prerequisites a fresh checkout lacks (installed dependencies,
# generated or reference trees). The orchestrator runs `bootstrap` in each new worktree after provisioning
# and before the runner spawn; it must leave `git status --short` empty. The runner runs `bootstrap_check`
# before its first stage spawn; a non-zero exit stops it with a TOOLING: clarification.
# Here: install the web dependencies, and link the two reference folders (CLAUDE.md; gitignored, read only) to the main checkout's
# when the name is free and the folder exists. The anchored .gitignore patterns keep the links out of git status.
bootstrap: 'npm --prefix web ci --no-audit --no-fund && main=$(dirname "$(cd "$(git rev-parse --git-common-dir)" && pwd)") && for d in irislib irissys; do if [ ! -e "$d" ] && [ ! -L "$d" ] && [ -d "$main/$d" ]; then ln -s "$main/$d" "$d"; fi; done'
bootstrap_check: 'test -d web/node_modules/@angular/core && test -f irislib/%Library/DynamicObject.cls && test -d irissys/Security && test -z "$(git status --short)"'
